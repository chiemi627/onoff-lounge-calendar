<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>OnOffラウンジ 予定（サイネージ）</title>
<link rel="stylesheet" href="signage.css">
</head>
<body>
<div class="sign">

  <header class="head">
    <h1 class="brand">OnOff<span>ラウンジ</span></h1>
    <div class="clock">
      <span class="clock-time" id="clock-time">--:--</span>
      <span class="clock-date" id="clock-date">&nbsp;</span>
    </div>
  </header>

  <section class="status" id="status">
    <p class="status-label" id="status-label">読み込み中</p>
    <p class="status-detail" id="status-detail">&nbsp;</p>
  </section>

  <main class="main">
    <h2 class="sec-title">今週の予定</h2>
    <div class="days" id="week0"></div>
  </main>

  <section class="next">
    <h2 class="sec-title sub">来週</h2>
    <div class="mini" id="week1"></div>
  </section>

  <aside class="rail">
    <div class="qr">
      <img src="qr-form.svg" alt="予約フォームのQRコード">
      <p class="qr-title">ラウンジを予約する</p>
    </div>
    <div class="qr">
      <img src="qr-mobile.svg" alt="スマホ用予定ページのQRコード">
      <p class="qr-title">スマホで予定を見る</p>
    </div>
  </aside>

  <p class="foot" id="foot">&nbsp;</p>

</div>
<script src="signage.js"></script>
</body>
</html>
